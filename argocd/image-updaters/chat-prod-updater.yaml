apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: chat-prod-updater
  namespace: argocd
spec:
  # Required: namespace where ArgoCD Applications are
  namespace: argocd
  
  # Global write-back configuration (at top level, not inside applicationRefs)
  writeBackConfig:
    method: git
    git:
      branch: main
      credentials:
        secretRef:
          name: argocd-image-updater-git-creds
          namespace: argocd
  
  # Required: list of applications to manage
  applicationRefs:
    - namePattern: "chat-prod"
      images:
        - alias: "backend"
          imageName: "yuvrajsoam/chatapp-backend"
          updateStrategy: semver
        - alias: "frontend"
          imageName: "yuvrajsoam/chatapp-frontend"
          updateStrategy: semver
