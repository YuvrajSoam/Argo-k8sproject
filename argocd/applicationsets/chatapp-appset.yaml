apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: chatapp-appset
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - env: dev
        path: k8s/overlays/dev
        namespace: chat-app
      - env: prod
        path: k8s/overlays/prod
        namespace: chat-app-prod

  template:
    metadata:
      name: chat-{{env}}
      annotations:
        # Image list: alias=image format, comma-separated (NOT multiline YAML)
        argocd-image-updater.argoproj.io/image-list: backend=yuvrajsoam/chatapp-backend,frontend=yuvrajsoam/chatapp-frontend
        # Update strategy for each alias
        argocd-image-updater.argoproj.io/backend.update-strategy: semver
        argocd-image-updater.argoproj.io/frontend.update-strategy: semver
        # Tell image updater which Kustomize image entry to update (must match 'name' in kustomization.yaml images block)
        argocd-image-updater.argoproj.io/backend.kustomize.image-name: yuvrajsoam/chatapp-backend
        argocd-image-updater.argoproj.io/frontend.kustomize.image-name: yuvrajsoam/chatapp-frontend
        # Write-back method: commit changes to Git (format: git:secret:namespace/secret-name)
        argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-git-creds
        argocd-image-updater.argoproj.io/git-branch: main
    spec:
      project: chatapp-project
      source:
        repoURL: https://github.com/YuvrajSoam/Argo-k8sproject.git
        targetRevision: main
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 3
