apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: chatapp-backend
spec:
  selector:
    matchLabels:
      app: chatapp-backend
  replicas: 1
  template:
    metadata:
      labels:
        app: chatapp-backend
    spec:
      containers:
      - name: chatapp-backend
        image: yuvrajsoam/chatapp-backend
        ports:
        - containerPort: 5001
        env:
        - name: NODE_ENV
          value: production
        - name: MONGODB_URI
          value: "mongodb://mongoadmin:secret@mongodb:27017/dbname?authSource=admin"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: chatapp-secret
              key: jwt
        - name: PORT
          value: "5001"
